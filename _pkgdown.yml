url: https://ipea.github.io/gtfstools/

template:
  bootstrap: 5
  light-switch: true

development:
  mode: auto

reference:
  - title: "Input/output"
  - contents:
    - read_gtfs
    - write_gtfs
  - title: "Query information from GTFS feeds"
  - contents:
    - starts_with("get_")
    - -get_trip_geometry
    - -get_route_geometry
    - -get_stops_geometry
    - -get_shapes_geometry
  - title: "Filter GTFS feeds"
  - contents:
    - starts_with("filter_by_")
    - -filter_by_sf
  - title: "Spatial operations"
  - contents:
    - convert_sf_to_shapes
    - crop_gtfs
    - filter_by_spatial_extent
    - get_trip_geometry
    - get_route_geometry
    - get_shapes_geometry
    - get_stops_geometry
  - title: "Editing GTFS feeds"
  - contents:
    - interpolate_stop_times
    - interpolate_shape_dist_traveled
    - merge_gtfs
    - combine_nearby_stops
    - remove_duplicates
    - remove_unused_ids
    - fix_gtfs
    - set_dwell_time
    - set_min_dwell_time
    - set_max_speed
    - set_min_speed
    - set_route_frequency
    - set_trip_speed
    - set_route_speed
    - stop_times_to_frequencies
    - frequencies_to_stop_times
  - title: "Validate GTFS feeds"
  - contents:
    - download_validator
    - list_validator_versions
    - validate_gtfs
  - title: "Support functions"
  - contents:
    - convert_stops_to_shapes
    - convert_time_to_seconds
    - convert_seconds_to_time
  - title: "Network analysis"
  - contents:
    - "build_graph"
  - title: "Interoperability between GTFS packages"
  - contents:
    - "as_dt_gtfs"
  - title: "Deprecated and defunct"
  - contents:
    - convert_shapes_to_sf
    - convert_stops_to_sf
    - filter_by_sf
